apiVersion: v1
data:
  cloud-native-devops.json: |-
    {
      "title": "Cloud Native DevOps Platform",
      "uid": "cloud-native-devops",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "App replicas available",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"default\",deployment=\"cloud-native-devops\"}",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "App CPU % of request",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "(sum(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod=~\"cloud-native-devops-.*\",container!=\"POD\"}[5m])) / sum(kube_pod_container_resource_requests{namespace=\"default\",pod=~\"cloud-native-devops-.*\",resource=\"cpu\",unit=\"core\"})) * 100",
              "refId": "A",
              "legendFormat": "cpu %"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "App memory",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",pod=~\"cloud-native-devops-.*\",container!=\"POD\"})",
              "refId": "A",
              "legendFormat": "memory"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "App container restarts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"default\",pod=~\"cloud-native-devops-.*\"})",
              "refId": "A",
              "legendFormat": "restarts"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HPA current replicas",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"default\"}",
              "refId": "A",
              "legendFormat": "{{horizontalpodautoscaler}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Postgres ready",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"default\",pod=~\"postgres-.*\",condition=\"true\"})",
              "refId": "A",
              "legendFormat": "ready"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Postgres memory",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 8,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",pod=~\"postgres-.*\",container!=\"POD\"})",
              "refId": "A",
              "legendFormat": "memory"
            }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: cloud-native-devops-dashboard
  namespace: monitoring
