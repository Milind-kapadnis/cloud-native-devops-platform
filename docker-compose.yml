version: "3.9"

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: cloud-native-devops-app
    depends_on:
      - postgres-db
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres-db:5432/devops_db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
