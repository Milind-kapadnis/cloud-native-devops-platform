apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-native-devops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloud-native-devops

  template:
    metadata:
      labels:
        app: cloud-native-devops

    spec:
      containers:
        - name: cloud-native-devops

          image: ghcr.io/milind-kapadnis/cloud-native-devops:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL  
