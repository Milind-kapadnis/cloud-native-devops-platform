apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-native-devops-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-native-devops

  template:
    metadata:
      labels:
        app: cloud-native-devops

    spec:
      containers:
        - name: cloud-native-devops-container
          image: cloud-native-devops-platform:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
