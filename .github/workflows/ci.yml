name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-cd

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: devops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d devops_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://admin:admin123@localhost:5432/devops_db
        run: |
          pytest

      - name: Build Docker Image
        run: |
          docker build -t cloud-native-devops:latest .
